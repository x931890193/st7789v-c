# Dashboard runtime config.
# weather_location empty means wttr.in will auto-detect by IP.
weather_location=

# Backlight brightness, percent.
brightness_day=100
brightness_dim=60
brightness_night=28
night_start=23
night_end=7
dim_evening_hour=22
dim_morning_hour=7

# Alert thresholds.
cpu_alert=80
mem_alert=85
temp_alert=70
disk_alert=85

# Display smoothing for network rates, seconds.
net_smoothing_seconds=5
